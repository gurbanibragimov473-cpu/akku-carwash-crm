<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запись на мойку — АККУ</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{font-family:Manrope,Arial,sans-serif;color:#19221f;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid #e9edeb;border-radius:22px;padding:clamp(22px,6vw,38px)}.brand{font-weight:800;color:#176b53}.eyebrow{font-size:10px;letter-spacing:1.3px;color:#84928a;font-weight:800;margin-top:28px}h1{font-size:30px;margin:8px 0}.lead{color:#7d8982;font-size:13px;line-height:1.6}form{display:grid;gap:14px}label{display:grid;gap:6px;color:#59675f;font-size:11px;font-weight:700}input,select{width:100%;height:46px;border:1px solid #dfe6e2;border-radius:10px;padding:0 12px;font:500 13px Manrope;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.button{height:48px;background:#176b53;color:#fff;border:0;border-radius:11px;font:800 13px Manrope}.note,.error{font-size:11px;color:#839087;line-height:1.5}.error{color:#b44338}.success{display:none;background:#eef7f1;border-radius:12px;padding:16px;font-size:13px;line-height:1.7}.success.show{display:block}.success a{color:#176b53;font-weight:800}.back{display:block;text-align:center;color:#6e7c74;font-size:11px;text-decoration:none;margin-top:17px}@media(max-width:480px){body{padding:0;background:#fff}.card{border:0;min-height:100vh}.row{grid-template-columns:1fr}}</style></head><body><main class="card"><div class="brand">АККУ · Автомоечный комплекс</div><div class="eyebrow">ОНЛАЙН-ЗАПИСЬ</div><h1>Выберите удобное время</h1><p class="lead">Оставьте контакты и данные автомобиля. Для автоматических напоминаний подключите Telegram после записи.</p><form id="booking"><label>Ваше имя<input name="name" required maxlength="100" autocomplete="name"></label><label>Телефон<input name="phone" required maxlength="30" autocomplete="tel" placeholder="+7 700 000 00 00"></label><div class="row"><label>Госномер<input name="plate" required maxlength="20"></label><label>Автомобиль<input name="vehicle" maxlength="100" placeholder="Toyota Camry"></label></div><label>Услуга<select name="service"><option>Комплексная мойка</option><option>Кузов</option><option>Кузов и салон</option><option>Детейлинг</option></select></label><label>Дата и время<input name="scheduled_for" id="scheduled" type="datetime-local" step="1800" required></label><p class="note">Запись доступна за 30 минут — 30 дней. Занятое время нельзя забронировать.</p><p class="error" id="error"></p><button class="button">Записаться</button></form><section class="success" id="success"></section><a class="back" href="/">← На главную</a></main><script>const f=document.getElementById('booking'),i=document.getElementById('scheduled'),e=document.getElementById('error'),s=document.getElementById('success');let d=new Date(Date.now()+1800000);d.setMinutes(Math.ceil(d.getMinutes()/30)*30,0,0);i.min=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);f.onsubmit=async x=>{x.preventDefault();e.textContent='';const a=Object.fromEntries(new FormData(f));a.scheduled_for=new Date(a.scheduled_for).toISOString();try{const r=await fetch('/api/bookings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(a)}),b=await r.json();if(!r.ok)throw Error(b.error||'Ошибка записи');f.hidden=true;s.classList.add('show');s.innerHTML='✅ Запись принята.'+(b.telegramLink?'<br>Для напоминаний подключите бота: <a target="_blank" rel="noopener" href="'+b.telegramLink+'">Подключить Telegram</a>':'');}catch(z){e.textContent=z.message;}}</script></body></html>
